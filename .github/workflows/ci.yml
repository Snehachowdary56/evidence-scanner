name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test
      - run: dotnet run --project src/EvidenceScanner.Cli -- demo
      - run: dotnet run --project src/EvidenceScanner.Cli -- verify output/sample_evidence output/manifest.json
